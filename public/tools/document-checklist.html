<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>문서 내보내기 전 점검표</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}:root{--bg:#f6f7fb;--card:#fff;--line:#e5e9f2;--ink:#111827;--sub:#6b7280;--brand:#4f46e5;--brand2:#7c3aed;--ok:#059669;--warn:#d97706;--bad:#e11d48;--r:14px}
body{font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);padding:14px;min-height:100vh;font-size:14px;line-height:1.5}.wrap{max-width:800px;margin:0 auto}h1{font-size:18px;font-weight:800;letter-spacing:-.02em}.sub{color:var(--sub);font-size:12px;margin-top:2px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:12px;box-shadow:0 1px 2px rgba(17,24,39,.04)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:8px 12px;font-weight:700;font-size:12px;transition:.12s}button:hover{border-color:#c7cddb;background:#fafafa}button.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-color:transparent}button.primary:hover{filter:brightness(1.07)}input{font:inherit;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-size:13px}input:focus{outline:2px solid #c7d2fe;border-color:var(--brand)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.muted{font-size:11px;color:var(--sub)}.grow{flex:1;min-width:180px}.progress{height:9px;background:#eef2f7;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),#8b5cf6);border-radius:99px;transition:width .2s}.group{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:10px}.group-head{display:flex;justify-content:space-between;align-items:center;background:#f8fafc;padding:9px 12px}.group-head b{font-size:12px}.item{display:flex;align-items:flex-start;gap:9px;padding:10px 12px;border-top:1px solid #f1f3f7}.item input[type=checkbox]{width:17px;height:17px;flex:0 0 auto;margin-top:1px;accent-color:var(--brand);cursor:pointer}.item label{flex:1;font-size:12px;font-weight:600;color:#334155;cursor:pointer}.item.done label{text-decoration:line-through;color:#94a3b8}.remove{border:0;background:transparent;color:#cbd5e1;padding:1px 4px;font-size:14px}.remove:hover{color:var(--bad);background:transparent}.add-row{display:flex;gap:7px;margin-top:8px}.input-new{flex:1;min-width:130px}.stats{display:flex;align-items:center;gap:12px}.count{font-size:18px;font-weight:900;color:var(--brand);white-space:nowrap}.usecases{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}.usecases h2{font-size:12px;font-weight:900;color:var(--sub);margin-bottom:5px}.usecases li{font-size:11px;color:var(--sub);margin-left:15px;margin-bottom:3px}
@media print{body{background:#fff;padding:0}.no-print{display:none!important}.card{box-shadow:none}.group{break-inside:avoid}}
</style>
</head>
<body><div class="wrap">
<header><h1>📤 문서 내보내기 전 점검표</h1><p class="sub">보내기 전에 1분만 확인하세요. 빠뜨리기 쉬운 수신자·첨부·개인정보·버전 오류를 차례로 점검합니다.</p></header>
<section class="card no-print"><div class="row"><div class="grow"><label class="muted" for="docTitle">문서 이름</label><input id="docTitle" placeholder="예: 3분기 실적 보고서"></div><span class="count" id="count">0/0</span></div><div style="margin-top:9px" class="progress"><i id="bar"></i></div><p class="muted" id="progressText" style="margin-top:5px">모든 항목을 확인해 주세요.</p></section>
<div id="groups"></div>
<section class="card no-print"><div class="row"><input id="newTask" class="input-new" placeholder="우리 팀 점검 항목 추가"><button class="primary" id="addTask">+ 항목 추가</button></div><div class="row" style="margin-top:10px"><button id="copyBtn">점검 결과 복사</button><button id="resetBtn">체크만 초기화</button><button id="sampleBtn">예시로 되돌리기</button><button id="printBtn">인쇄 · PDF</button></div><p class="muted" style="margin-top:8px">항목과 체크 상태는 이 브라우저에 저장돼요. 고객·팀별 점검 항목을 직접 추가해 쓰세요.</p></section>
<div class="usecases"><h2>이럴 때 좋아요</h2><ul><li><b>모든 직장인</b> · 메일·메신저에 파일을 보내기 전에 수신자와 첨부를 빠르게 확인할 때</li><li><b>총무·기획</b> · 여러 사람이 쓰는 문서에 공통 점검 절차를 만들 때</li><li><b>개인정보 담당</b> · 공유 파일에 연락처·계좌번호 등 민감 정보가 남았는지 확인할 때</li></ul></div>
</div>
<script>
(function(){"use strict";var KEY="document-checklist-v1";var seed=[
 {name:"내용·형식",items:["제목과 파일명이 내용을 정확히 설명한다","본문의 날짜·금액·이름이 최신 정보다","오탈자와 표·그림 번호를 다시 확인했다","페이지 나눔과 인쇄 미리보기가 정상이다"]},
 {name:"받는 사람·첨부",items:["받는 사람과 참조(CC)를 다시 확인했다","첨부 파일을 실제로 열어 내용과 버전을 확인했다","본문에 약속한 링크와 파일이 모두 포함돼 있다"]},
 {name:"개인정보·보안",items:["숨김 시트·메모·수정 이력에 불필요한 정보가 없다","개인정보·계좌번호·내부용 숫자를 확인했다","공유 권한과 파일 비밀번호가 올바르다"]},
 {name:"마지막 확인",items:["파일 형식(PDF·DOCX·XLSX)이 요청과 일치한다","최종본 파일명과 저장 위치를 확인했다","필요한 승인·검토를 받았다"]}
];var state={title:"",groups:seed.map(function(g){return{name:g.name,items:g.items.map(function(t){return{text:t,done:false,custom:false}})}})};
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}function load(){try{var x=JSON.parse(localStorage.getItem(KEY)||"null");if(x&&x.groups)state=x}catch(e){}}
function esc(s){return String(s).replace(/[&<>\"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;"}[c]})}
function render(){var box=document.getElementById("groups");box.innerHTML="";document.getElementById("docTitle").value=state.title||"";var total=0,done=0;
 state.groups.forEach(function(g,gi){var group=document.createElement("section");group.className="group";var completed=g.items.filter(function(it){return it.done}).length;total+=g.items.length;done+=completed;group.innerHTML='<div class="group-head"><b>'+esc(g.name)+'</b><span class="muted">'+completed+' / '+g.items.length+'</span></div>';
 g.items.forEach(function(it,ii){var row=document.createElement("div");row.className="item"+(it.done?" done":"");row.innerHTML='<input type="checkbox" id="c-'+gi+'-'+ii+'" '+(it.done?"checked":"")+'><label for="c-'+gi+'-'+ii+'">'+esc(it.text)+'</label>'+(it.custom?'<button class="remove" aria-label="항목 삭제">×</button>':"");row.querySelector("input").onchange=function(){it.done=this.checked;save();render()};var del=row.querySelector(".remove");if(del)del.onclick=function(){g.items.splice(ii,1);save();render()};group.appendChild(row)});box.appendChild(group)});
 var pct=total?Math.round(done/total*100):0;document.getElementById("count").textContent=done+"/"+total;document.getElementById("bar").style.width=pct+"%";document.getElementById("progressText").textContent=pct===100?"모든 항목을 확인했어요. 이제 보내도 좋아요! 🎉":pct+"% 확인 · " +(total-done)+"개 남음";save();}
document.getElementById("docTitle").oninput=function(){state.title=this.value;save()};document.getElementById("addTask").onclick=function(){var v=document.getElementById("newTask").value.trim();if(!v)return;state.groups[0].items.push({text:v,done:false,custom:true});document.getElementById("newTask").value="";render()};document.getElementById("newTask").onkeydown=function(e){if(e.key==="Enter")document.getElementById("addTask").click()};
document.getElementById("copyBtn").onclick=function(){var lines=["[문서 내보내기 점검] "+(state.title||"문서")];state.groups.forEach(function(g){lines.push("",g.name);g.items.forEach(function(i){lines.push((i.done?"✓ ":"□ ")+i.text)})});var t=lines.join("\n");if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>this.textContent="복사됐어요 ✓").catch(()=>prompt("복사할 내용을 선택하세요",t));else prompt("복사할 내용을 선택하세요",t)};
document.getElementById("resetBtn").onclick=function(){state.groups.forEach(function(g){g.items.forEach(function(i){i.done=false})});render()};document.getElementById("sampleBtn").onclick=function(){if(confirm("기본 예시로 되돌릴까요?")){state={title:"",groups:seed.map(function(g){return{name:g.name,items:g.items.map(function(t){return{text:t,done:false,custom:false}})}})};render()}};document.getElementById("printBtn").onclick=function(){window.print()};load();render()})();
</script></body></html>
