<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>회식비 나누기</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}:root{--bg:#f6f7fb;--card:#fff;--line:#e5e9f2;--ink:#111827;--sub:#6b7280;--brand:#4f46e5;--brand2:#7c3aed;--ok:#059669;--warn:#d97706;--bad:#e11d48;--r:14px}body{font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);padding:14px;min-height:100vh;font-size:14px;line-height:1.5}.wrap{max-width:860px;margin:0 auto}h1{font-size:18px;font-weight:800;letter-spacing:-.02em}.sub{color:var(--sub);font-size:12px;margin-top:2px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:12px;box-shadow:0 1px 2px rgba(17,24,39,.04)}button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:8px 12px;font-weight:700;font-size:12px;transition:.12s}button:hover{border-color:#c7cddb;background:#fafafa}button.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-color:transparent}input,select{font:inherit;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-size:13px}input:focus,select:focus{outline:2px solid #c7d2fe;border-color:var(--brand)}label{font-size:10px;font-weight:800;color:var(--sub);display:block;margin-bottom:4px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.muted{font-size:11px;color:var(--sub)}.field{flex:1;min-width:110px}.people{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.person{display:inline-flex;align-items:center;gap:7px;padding:6px 9px;border-radius:999px;background:#eef2ff;color:#4338ca;font-size:12px;font-weight:800}.person button{padding:0;border:0;background:transparent;color:#818cf8;font-size:15px}.person button:hover{color:var(--bad)}.expense{display:grid;grid-template-columns:minmax(130px,1fr) 140px 145px 32px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #f1f3f7}.expense:last-child{border:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{border:1px solid var(--line);border-radius:11px;background:#f8fafc;padding:10px}.stat span{display:block;font-size:10px;font-weight:700;color:var(--sub)}.stat b{font-size:16px;display:block;margin-top:4px;font-variant-numeric:tabular-nums}.result-row{display:flex;justify-content:space-between;gap:10px;padding:8px 1px;border-bottom:1px solid #f1f3f7;font-size:12px}.result-row:last-child{border:0}.transfer{padding:9px 10px;margin-top:7px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;font-size:12px;font-weight:800;color:#047857}.usecases{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}.usecases h2{font-size:12px;font-weight:900;color:var(--sub);margin-bottom:5px}.usecases li{font-size:11px;color:var(--sub);margin-left:15px;margin-bottom:3px}@media(max-width:600px){.expense{grid-template-columns:1fr 96px 118px 28px;gap:5px}.expense input,.expense select{padding:7px;font-size:11px}.stats{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<header><h1>🍻 회식비 나누기</h1><p class="sub">여러 번 결제해도 괜찮아요. 누가 얼마를 냈는지 넣으면 1인 부담액과 송금할 사람·금액을 계산합니다.</p></header>
<section class="card"><div class="row"><div class="field"><label for="personName">참여자 이름</label><input id="personName" placeholder="예: 김보고"></div><button class="primary" id="addPerson">+ 사람 추가</button><div class="field" style="max-width:180px"><label for="tip">팁·추가 비용</label><select id="tip"><option value="0">없음</option><option value="5">5%</option><option value="10" selected>10%</option><option value="15">15%</option><option value="custom">직접 입력</option></select></div><div class="field" id="tipCustomBox" style="display:none;max-width:120px"><label for="tipCustom">직접 입력 (%)</label><input id="tipCustom" type="number" value="0" min="0" max="100"></div></div><div class="people" id="people"></div></section>
<section class="card"><div class="row" style="justify-content:space-between"><b style="font-size:13px">결제 내역</b><span class="muted">각 비용은 참여자 모두가 나눠 내요</span></div><div id="expenses" style="margin-top:8px"></div><div class="row" style="margin-top:10px"><div class="field"><label for="expenseName">내역</label><input id="expenseName" placeholder="예: 저녁 식사"></div><div class="field" style="max-width:150px"><label for="expenseAmount">금액 (원)</label><input id="expenseAmount" type="number" min="0" placeholder="예: 180000"></div><div class="field" style="max-width:160px"><label for="expensePayer">결제한 사람</label><select id="expensePayer"></select></div><button id="addExpense" class="primary">+ 결제 추가</button></div></section>
<section class="card"><div class="row" style="justify-content:space-between"><b style="font-size:13px">정산 결과</b><button id="copy">정산 내용 복사</button></div><div class="stats" id="stats" style="margin-top:9px"></div><div id="balances" style="margin-top:9px"></div><div id="transfers" style="margin-top:9px"></div></section>
<div class="row" style="margin-top:10px"><button id="sample">예시로 채우기</button><button id="reset">모두 초기화</button><span class="muted">이름·결제 내역은 내 브라우저에만 저장됩니다.</span></div>
<div class="usecases"><h2>이럴 때 좋아요</h2><ul><li><b>팀원</b> · 한 사람이 선결제한 식사비를 정확하고 빠르게 나눌 때</li><li><b>모임 주최자</b> · 장소·택시처럼 결제자가 여러 명이어도 송금 금액을 정리할 때</li><li><b>총무</b> · 정산 결과를 복사해 단체방에 공유할 때</li></ul></div>
</div><script>
(function(){"use strict";var KEY="dinner-split-v1";var seed={tip:10,people:[{id:"p1",name:"김보고"},{id:"p2",name:"이개발"},{id:"p3",name:"박디자인"},{id:"p4",name:"최성장"}],expenses:[{id:"e1",name:"저녁 식사",amount:180000,payer:"p1"},{id:"e2",name:"2차 카페",amount:48000,payer:"p2"},{id:"e3",name:"택시",amount:24000,payer:"p3"}]};var state={tip:10,people:[],expenses:[]};var $=function(id){return document.getElementById(id)};function id(){return "x"+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}function load(){try{var s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&Array.isArray(s.people))state=s}catch(e){}}
function tipPct(){return $("tip").value==="custom"?Math.max(0,Number($("tipCustom").value)||0):Number($("tip").value)||0}function won(n){return Math.round(n).toLocaleString("ko-KR")+"원"}function esc(s){return String(s).replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;"}[c]))}
function options(selected){return state.people.map(p=>'<option value="'+p.id+'" '+(p.id===selected?"selected":"")+'>'+esc(p.name)+'</option>').join("")}
function settle(){var total=state.expenses.reduce((s,e)=>s+(Number(e.amount)||0),0);var fee=Math.round(total*tipPct()/100);var grand=total+fee;var n=state.people.length;if(!n)return{total,fee,grand,shares:[],balances:[],moves:[]};var base=Math.floor(grand/n),rem=grand%n;var shares=state.people.map((p,i)=>base+(i<rem?1:0));var paid=state.people.map(p=>state.expenses.filter(e=>e.payer===p.id).reduce((s,e)=>s+(Number(e.amount)||0),0));var balances=state.people.map((p,i)=>({id:p.id,name:p.name,paid:paid[i],share:shares[i],net:paid[i]-shares[i]}));var owes=balances.filter(b=>b.net<0).map(b=>({id:b.id,name:b.name,amt:-b.net})).sort((a,b)=>b.amt-a.amt);var gets=balances.filter(b=>b.net>0).map(b=>({id:b.id,name:b.name,amt:b.net})).sort((a,b)=>b.amt-a.amt);var moves=[];var i=0,j=0;while(i<owes.length&&j<gets.length){var x=Math.min(owes[i].amt,gets[j].amt);if(x>0)moves.push({from:owes[i].name,to:gets[j].name,amount:x});owes[i].amt-=x;gets[j].amt-=x;if(owes[i].amt===0)i++;if(gets[j].amt===0)j++}return{total,fee,grand,shares,balances,moves}}
function render(){
 var ppl=$("people");ppl.innerHTML="";state.people.forEach(function(p,i){var chip=document.createElement("span");chip.className="person";chip.innerHTML=esc(p.name)+' <button type="button" aria-label="'+esc(p.name)+' 삭제">×</button>';chip.querySelector("button").onclick=function(){state.people.splice(i,1);state.expenses=state.expenses.filter(e=>e.payer!==p.id);render()};ppl.appendChild(chip)});
 var payer=$("expensePayer");var current=payer.value;payer.innerHTML=options(current&&state.people.some(p=>p.id===current)?current:(state.people[0]?.id||""));
 var box=$("expenses");box.innerHTML="";state.expenses.forEach(function(e,i){var row=document.createElement("div");row.className="expense";row.innerHTML='<input aria-label="결제 내역" value="'+esc(e.name)+'"><input aria-label="금액" type="number" min="0" value="'+Number(e.amount||0)+'"><select aria-label="결제한 사람">'+options(e.payer)+'</select><button class="remove" aria-label="결제 삭제" style="border:0;padding:3px;color:#cbd5e1">×</button>';var a=row.querySelectorAll("input");a[0].oninput=function(){e.name=this.value;save()};a[1].oninput=function(){e.amount=Number(this.value)||0;renderResult()};row.querySelector("select").onchange=function(){e.payer=this.value;renderResult()};row.querySelector("button").onclick=function(){state.expenses.splice(i,1);render()};box.appendChild(row)});
 $("tip").value=state.tip<=15?String(state.tip):"custom";$("tipCustomBox").style.display=$("tip").value==="custom"?"block":"none";if($("tip").value==="custom")$("tipCustom").value=state.tip;renderResult();save()}
function renderResult(){var r=settle();$("stats").innerHTML=[["총 결제",won(r.total)],["추가 비용",won(r.fee)],["최종 합계",won(r.grand)]].map(x=>'<div class="stat"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join("");var box=$("balances");box.innerHTML="";r.balances.forEach(function(b){var row=document.createElement("div");row.className="result-row";var label=b.net>0?"받을 금액":b.net<0?"낼 금액":"정산 완료";var amount=b.net>0?"+"+won(b.net):b.net<0?"−"+won(-b.net):won(0);row.innerHTML='<span><b>'+esc(b.name)+'</b><span class="muted"> · 결제 '+won(b.paid)+' / 1인 부담 '+won(b.share)+'</span></span><b style="color:'+(b.net>0?"#047857":b.net<0?"#be123c":"#64748b")+'">'+label+' '+amount+'</b>';box.appendChild(row)});var trans=$("transfers");trans.innerHTML=r.moves.length?'<p class="muted" style="font-weight:800;margin:8px 0 4px">송금하면 정산 완료</p>'+r.moves.map(m=>'<div class="transfer">'+esc(m.from)+' → '+esc(m.to)+'　'+won(m.amount)+'</div>').join(""):'<p class="muted" style="margin-top:8px">참여자와 결제 내역을 넣으면 정산이 계산돼요.</p>'}
$("addPerson").onclick=function(){var name=$("personName").value.trim();if(!name)return;if(state.people.some(p=>p.name.toLowerCase()===name.toLowerCase())){alert("이미 등록된 이름이에요.");return}state.people.push({id:id(),name});$("personName").value="";render()};$("personName").onkeydown=function(e){if(e.key==="Enter")$("addPerson").click()};$("addExpense").onclick=function(){var name=$("expenseName").value.trim()||"기타 비용";var amount=Number($("expenseAmount").value)||0;if(!state.people.length){alert("참여자를 먼저 추가해 주세요.");return}if(amount<=0){$("expenseAmount").focus();return}state.expenses.push({id:id(),name,amount,payer:$("expensePayer").value||state.people[0].id});$("expenseName").value="";$("expenseAmount").value="";render()};$("expenseAmount").onkeydown=function(e){if(e.key==="Enter")$("addExpense").click()};$("tip").onchange=function(){state.tip=this.value==="custom"?Number($("tipCustom").value)||0:Number(this.value);$("tipCustomBox").style.display=this.value==="custom"?"block":"none";renderResult();save()};$("tipCustom").oninput=function(){state.tip=Number(this.value)||0;renderResult();save()};$("copy").onclick=function(){var r=settle(),lines=["[회식비 정산]",...r.balances.map(b=>b.name+": "+(b.net>0?"받을 ":b.net<0?"낼 ":"정산 완료 ")+(b.net?won(Math.abs(b.net)):"")),"","송금 방법:",...r.moves.map(m=>m.from+" → "+m.to+" "+won(m.amount))];var text=lines.join("\n");if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>this.textContent="복사됐어요 ✓").catch(()=>prompt("정산 내용을 복사하세요",text));else prompt("정산 내용을 복사하세요",text)};$("sample").onclick=function(){state=JSON.parse(JSON.stringify(seed));render()};$("reset").onclick=function(){if(confirm("참여자와 결제 내역을 비울까요?")){state={tip:0,people:[],expenses:[]};render()}};load();if(!state.people.length)state=JSON.parse(JSON.stringify(seed));render()})();
</script></body></html>
