<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>점검표 만들기</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}:root{--bg:#f6f7fb;--card:#fff;--line:#e5e9f2;--ink:#111827;--sub:#6b7280;--brand:#4f46e5;--brand2:#7c3aed;--ok:#059669;--warn:#d97706;--bad:#e11d48;--r:14px}body{font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);padding:14px;min-height:100vh;font-size:14px;line-height:1.5}.wrap{max-width:800px;margin:0 auto}h1{font-size:18px;font-weight:800;letter-spacing:-.02em}.sub{color:var(--sub);font-size:12px;margin-top:2px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:12px;box-shadow:0 1px 2px rgba(17,24,39,.04)}button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:8px 12px;font-weight:700;font-size:12px;transition:.12s}button:hover{border-color:#c7cddb;background:#fafafa}button.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-color:transparent}input,textarea{font:inherit;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-size:13px}input:focus,textarea:focus{outline:2px solid #c7d2fe;border-color:var(--brand)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.muted{font-size:11px;color:var(--sub)}.grow{flex:1;min-width:180px}.group{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:10px}.grouphead{display:flex;align-items:center;gap:8px;padding:9px 11px;background:#f8fafc}.grouphead input{border:0;background:transparent;font-size:12px;font-weight:900;padding:2px;flex:1}.grouphead .remove{border:0;background:transparent;color:#cbd5e1;padding:2px}.task{display:flex;align-items:center;gap:9px;padding:9px 11px;border-top:1px solid #f1f3f7}.task input[type=checkbox]{width:17px;height:17px;accent-color:var(--brand);flex:0 0 auto}.task .text{flex:1;min-width:0;border:0;background:transparent;padding:3px;font-size:12px}.task.done .text{text-decoration:line-through;color:#94a3b8}.task button{border:0;background:transparent;color:#cbd5e1;padding:2px 5px}.progress{height:9px;background:#eef2f7;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#8b5cf6);border-radius:99px;transition:width .2s}.usecases{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}.usecases h2{font-size:12px;font-weight:900;color:var(--sub);margin-bottom:5px}.usecases li{font-size:11px;color:var(--sub);margin-left:15px;margin-bottom:3px}@media print{body{background:#fff;padding:0}.no-print{display:none!important}.card,.group{box-shadow:none;break-inside:avoid}.grouphead{print-color-adjust:exact;-webkit-print-color-adjust:exact}}
</style></head><body><div class="wrap">
<header><h1>🧰 점검표 만들기</h1><p class="sub">업무·행사·오픈·마감에 필요한 체크리스트를 직접 만들고, 진행률을 확인하고, 출력하세요.</p></header>
<section class="card no-print"><div class="row"><div class="grow"><label class="muted" for="title">점검표 이름</label><input id="title" placeholder="예: 행사장 오픈 점검"></div><div class="grow"><label class="muted" for="template">시작 템플릿</label><select id="template" style="width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:inherit;font-size:13px"><option value="office">사무실 오픈</option><option value="event">행사 진행</option><option value="release">문서·배포 전</option><option value="empty">빈 점검표</option></select></div><button id="applyTemplate">템플릿 불러오기</button></div></section>
<section class="card"><div class="row" style="justify-content:space-between;gap:10px"><div class="row"><b id="titleDisplay" style="font-size:13px">사무실 오픈 점검</b><span id="progressText" class="muted"></span></div><button class="no-print" id="resetChecks">체크 초기화</button></div><div class="progress" style="margin-top:9px"><i id="progressBar"></i></div><div id="groups"></div><div class="row no-print" style="margin-top:11px"><button class="primary" id="addGroup">+ 구역 추가</button><button id="print">인쇄 · PDF</button><button id="copy">점검 결과 복사</button></div></section>
<section class="card no-print"><b style="font-size:12px">항목 빠르게 추가</b><div class="row" style="margin-top:7px"><input id="newTask" class="grow" placeholder="예: 회의실 화면과 마이크 작동 확인"><button class="primary" id="addTask">+ 현재 구역에 추가</button></div><p class="muted" style="margin-top:6px">항목을 바로 고쳐 우리 팀의 실제 순서에 맞춰 보세요. 내용은 이 브라우저에 자동 저장됩니다.</p></section>
<div class="usecases"><h2>이럴 때 좋아요</h2><ul><li><b>총무·운영</b> · 사무실 오픈·마감이나 주기 점검 순서를 표준화할 때</li><li><b>기획·교육</b> · 행사 당일 담당자별 준비 상황을 한 화면에서 확인할 때</li><li><b>팀장</b> · 신입·대체 근무자도 같은 품질로 업무를 수행하게 안내할 때</li></ul></div>
</div><script>
(function(){"use strict";var KEY="checklist-maker-v1";var templates={office:{title:"사무실 오픈 점검",groups:[{name:"업무 공간",items:["출입문·보안 장치 확인","회의실 화면·마이크 작동 확인","환기·조명·냉난방 확인"]},{name:"업무 시작",items:["공용 메일·공지 확인","오늘 일정·당직 확인","비품·프린터 용지 확인"]}]},event:{title:"행사 진행 점검표",groups:[{name:"시작 전",items:["장소·좌석·동선 확인","발표 자료와 음향 테스트","참석자 명단·안내 표지 준비"]},{name:"진행 중",items:["진행 시간·순서 확인","질문·요청사항 기록","사진·기록 담당 확인"]},{name:"마무리",items:["분실물·대여 장비 확인","현장 정리·원상 복구","만족도·후속 안내 공유"]}]},release:{title:"문서·배포 전 점검",groups:[{name:"내용 확인",items:["최종 문구·숫자·날짜 검수","링크·첨부 파일 열림 확인","수신자·공개 범위 확인"]},{name:"승인·배포",items:["필요한 승인 완료","파일명·버전·저장 위치 확인","배포 후 실제 화면 확인"]}]},empty:{title:"새 점검표",groups:[{name:"새 구역",items:["첫 번째 점검 항목"]}]}};var state={title:"",groups:[]};var $=id=>document.getElementById(id);function id(){return"g"+Date.now().toString(36)+Math.random().toString(36).slice(2,4)}function createTemplate(key){var t=templates[key]||templates.office;return{title:t.title,groups:t.groups.map(g=>({id:id(),name:g.name,items:g.items.map(text=>({id:id(),text,done:false}))}))}}function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}function load(){try{var s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.groups)state=s}catch(e){}}function esc(s){return String(s).replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;"}[c]))}
function render(){ $("title").value=state.title;$("titleDisplay").textContent=state.title||"내 점검표";var total=0,done=0;var box=$("groups");box.innerHTML="";state.groups.forEach(function(g,gi){var sec=document.createElement("section");sec.className="group";sec.innerHTML='<div class="grouphead"><span>▦</span><input aria-label="구역 이름" value="'+esc(g.name)+'"><span class="muted">'+g.items.filter(x=>x.done).length+'/'+g.items.length+'</span><button class="remove no-print" aria-label="구역 삭제">×</button></div>';var inp=sec.querySelector("input");inp.oninput=function(){g.name=this.value;$("titleDisplay").textContent=state.title||"내 점검표";save()};sec.querySelector(".remove").onclick=function(){if(confirm("이 구역과 항목을 삭제할까요?")){state.groups.splice(gi,1);render()}};g.items.forEach(function(it,ii){total++;if(it.done)done++;var row=document.createElement("div");row.className="task"+(it.done?" done":"");row.innerHTML='<input type="checkbox" '+(it.done?"checked":"")+' aria-label="완료"><input class="text" value="'+esc(it.text)+'" aria-label="점검 항목"><button class="no-print" aria-label="항목 삭제">×</button>';row.querySelector("input[type=checkbox]").onchange=function(){it.done=this.checked;render()};row.querySelector(".text").oninput=function(){it.text=this.value;save()};row.querySelector("button").onclick=function(){g.items.splice(ii,1);render()};sec.appendChild(row)});box.appendChild(sec)});var pct=total?Math.round(done/total*100):0;$("progressText").textContent=done+" / "+total+"개 완료 · "+pct+"%";$("progressBar").style.width=pct+"%";save()}
$("title").oninput=function(){state.title=this.value;$("titleDisplay").textContent=this.value||"내 점검표";save()};$("applyTemplate").onclick=function(){if(confirm("현재 점검표를 템플릿으로 바꿀까요?")){state=createTemplate($("template").value);render()}};$("addGroup").onclick=function(){state.groups.push({id:id(),name:"새 구역",items:[]});render()};$("addTask").onclick=function(){var text=$("newTask").value.trim();if(!text)return;if(!state.groups.length)state.groups.push({id:id(),name:"새 구역",items:[]});state.groups[state.groups.length-1].items.push({id:id(),text,done:false});$("newTask").value="";render()};$("newTask").onkeydown=e=>{if(e.key==="Enter")$("addTask").click()};$("resetChecks").onclick=function(){state.groups.forEach(g=>g.items.forEach(i=>i.done=false));render()};$("print").onclick=function(){window.print()};$("copy").onclick=function(){var lines=["["+(state.title||"점검표")+"]"];state.groups.forEach(g=>{lines.push("",g.name);g.items.forEach(i=>lines.push((i.done?"✓ ":"□ ")+i.text))});var text=lines.join("\n");if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>this.textContent="복사됐어요 ✓").catch(()=>prompt("복사할 점검표",text));else prompt("복사할 점검표",text)};load();if(!state.groups.length)state=createTemplate("office");render()})();
</script></body></html>
