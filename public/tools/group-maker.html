<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>랜덤 모둠 편성기</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f6f7fb;--card:#fff;--line:#e5e9f2;--ink:#111827;--sub:#6b7280;--brand:#4f46e5;--brand2:#7c3aed;--ok:#059669;--warn:#b45309;--bad:#e11d48;--r:14px}
body{font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);padding:14px;min-height:100vh;font-size:14px;line-height:1.5}
[hidden]{display:none!important}
.wrap{max-width:1000px;margin:0 auto}h1{font-size:18px;font-weight:800;letter-spacing:-.02em}.sub{color:var(--sub);font-size:12px;margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:12px;box-shadow:0 1px 2px rgba(17,24,39,.04);min-width:0}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:7px 11px;font-weight:700;font-size:12px;transition:.12s}button:hover{border-color:#c7cddb;background:#fafafa}
button.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-color:transparent}button.primary:hover{filter:brightness(1.07)}
input,select,textarea{font:inherit;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-size:13px;min-width:0}
textarea{resize:vertical;min-height:150px;line-height:1.6}input[type=checkbox]{width:18px;height:18px;accent-color:var(--brand);cursor:pointer}
input:focus,select:focus,textarea:focus{outline:2px solid #c7d2fe;border-color:var(--brand)}
label{font-size:11px;font-weight:800;color:var(--sub);display:block;margin-bottom:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}.grow{flex:1;min-width:110px}.muted{color:var(--sub);font-size:12px}
.pill{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap}
.ok{background:#ecfdf5;color:#047857}.wn{background:#fffbeb;color:#b45309}.in{background:#eef2ff;color:#4338ca}
.usecases{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}.usecases h2{font-size:12px;font-weight:800;color:var(--sub);margin-bottom:6px}.usecases li{font-size:12px;color:var(--sub);margin-left:15px;margin-bottom:3px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:12px}@media(max-width:780px){.two{grid-template-columns:minmax(0,1fr)}}
.gs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.g{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff}.g h3{font-size:13px;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.m{display:flex;justify-content:space-between;gap:6px;padding:4px 0;border-top:1px dashed var(--line);font-size:13px;font-weight:700}.m small{font-size:10px;color:var(--sub);font-weight:700}
@media print{body{background:#fff;padding:0}.no-print{display:none!important}.card{box-shadow:none}.g{break-inside:avoid}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>🎲 랜덤 모둠 편성기</h1><p class="sub">이름을 붙여 넣고 버튼 한 번으로 공평하게 모둠을 짜요. 지난번 같은 모둠이었던 친구는 피하고, 반·학년 같은 구분은 골고루 섞어 줘요.</p></header>

<div class="two">
<section class="card">
  <label for="names">이름 목록 (한 줄에 한 명)</label>
  <textarea id="names" placeholder="예)&#10;김하늘&#10;이도윤, 1반&#10;박서연, 2반"></textarea>
  <p class="muted" style="margin-top:4px">「이름, 구분」처럼 쉼표 뒤에 반·팀·학년을 적으면 모둠마다 골고루 섞여요. <b id="cnt">0</b>명</p>
  <div class="row" style="margin-top:10px">
    <div><label for="mode">나누는 방법</label><select id="mode"><option value="groups">모둠 수로</option><option value="size">모둠당 인원으로</option></select></div>
    <div style="width:90px"><label for="num" id="numLabel">모둠 수</label><input id="num" type="number" min="1" max="50"></div>
  </div>
  <label style="display:flex;gap:8px;align-items:center;margin-top:10px;cursor:pointer"><input id="avoid" type="checkbox"> 지난번에 같은 모둠이었던 사람은 되도록 피하기</label>
  <div class="row no-print" style="margin-top:12px"><button class="primary" id="run">🎲 모둠 편성</button><button id="sample">예시 이름</button></div>
</section>

<section class="card">
  <div class="row" style="justify-content:space-between;align-items:center"><b style="font-size:13px">편성 결과</b><span class="muted" id="info"></span></div>
  <div id="out" class="gs" style="margin-top:10px"></div>
  <div class="row no-print" style="margin-top:12px"><button id="again">다시 섞기</button><button id="keep">이 편성을 기록으로 남기기</button><button id="copy">결과 복사</button><button id="print">인쇄·PDF</button><button id="clearHist">기록 지우기</button></div>
  <p class="muted" id="histInfo" style="margin-top:8px"></p>
</section>
</div>

<div class="usecases"><h2>이럴 때 좋아요</h2><ul>
<li><b>교육 담당</b> · 조별 활동마다 새로운 친구와 만나도록 모둠을 바꿀 때</li>
<li><b>학생</b> · 팀 프로젝트 조를 불만 없이 공정하게 정할 때</li>
<li><b>팀장</b> · 워크숍에서 부서가 섞이도록 팀을 짤 때</li></ul></div>
</div>

<script>
(function(){"use strict";
var KEY="group-maker-v1";
function load(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
var SAMPLE="김하늘, 1반\n이도윤, 1반\n박서연, 1반\n최민준, 1반\n정지우, 2반\n강하은, 2반\n조현우, 2반\n윤서아, 2반\n임지호, 3반\n한예린, 3반\n오승민, 3반\n신유나, 3반";
var S=load(KEY,null);if(!S||typeof S.text!=="string")S={text:SAMPLE,mode:"groups",num:3,avoid:true,hist:[],last:null};
if(!Array.isArray(S.hist))S.hist=[];
function parse(){var seen={},out=[];S.text.split(/\r?\n/).forEach(function(l){l=l.trim();if(!l)return;var p=l.split(/[,\t]/),name=p[0].trim(),tag=(p[1]||"").trim();if(!name||seen[name])return;seen[name]=1;out.push({n:name,t:tag})});return out}
function rint(k){if(window.crypto&&crypto.getRandomValues){var a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%k}return Math.floor(Math.random()*k)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rint(i+1),t=a[i];a[i]=a[j];a[j]=t}return a}
function groupCount(N){var v=Math.max(1,Math.floor(+S.num)||1);return S.mode==="size"?Math.max(1,Math.ceil(N/v)):Math.min(v,Math.max(1,N))}
function deal(people,k){var tags={},order=[];people.forEach(function(p){var t=p.t||"";if(!tags[t]){tags[t]=[];order.push(t)}tags[t].push(p)});
 order=shuffle(order).sort(function(a,b){return tags[b].length-tags[a].length});var seq=[];order.forEach(function(t){seq=seq.concat(shuffle(tags[t]))});
 var gs=[],i;for(i=0;i<k;i++)gs.push([]);var ptr=rint(k);seq.forEach(function(p){gs[ptr%k].push(p);ptr++});return gs}
function pairKey(a,b){return a<b?a+"|"+b:b+"|"+a}
function pairCounts(){var m={};S.hist.forEach(function(sess){sess.forEach(function(g){for(var i=0;i<g.length;i++)for(var j=i+1;j<g.length;j++){var k=pairKey(g[i],g[j]);m[k]=(m[k]||0)+1}})});return m}
function overlap(gs,m){var s=0;gs.forEach(function(g){for(var i=0;i<g.length;i++)for(var j=i+1;j<g.length;j++)s+=m[pairKey(g[i].n,g[j].n)]||0});return s}
function run(){var people=parse();$("cnt").textContent=people.length;if(!people.length){S.last=null;draw();return}
 var k=groupCount(people.length),m=S.avoid?pairCounts():{},best=null;
 for(var t=0;t<300;t++){var gs=deal(people,k),sc=S.avoid?overlap(gs,m):0;if(!best||sc<best.sc){best={gs:gs,sc:sc};if(sc===0)break}}
 S.last={gs:best.gs.map(function(g){return g.map(function(p){return{n:p.n,t:p.t}})}),sc:best.sc};draw()}
function draw(){var L=S.last;save(KEY,S);
 if(!L||!L.gs.length){$("out").innerHTML='<p class="muted">이름을 입력하고 「모둠 편성」을 눌러 주세요.</p>';$("info").textContent="";}
 else{$("out").innerHTML=L.gs.map(function(g,i){return '<div class="g"><h3>모둠 '+(i+1)+' <span class="pill in">'+g.length+'명</span></h3>'+g.map(function(p){return '<div class="m"><span>'+esc(p.n)+'</span>'+(p.t?'<small>'+esc(p.t)+'</small>':'')+'</div>'}).join("")+'</div>'}).join("");
  var total=L.gs.reduce(function(a,g){return a+g.length},0),sizes=L.gs.map(function(g){return g.length});
  $("info").textContent=total+"명 · "+L.gs.length+"개 모둠 ("+Math.min.apply(null,sizes)+(Math.min.apply(null,sizes)===Math.max.apply(null,sizes)?"":"~"+Math.max.apply(null,sizes))+"명씩)"+(S.avoid&&S.hist.length?" · 지난번과 겹친 짝 "+L.sc+"쌍":"")}
 $("histInfo").textContent=S.hist.length?"남겨 둔 지난 편성 "+S.hist.length+"회 — 다음 편성부터 같은 짝을 피해요.":"「이 편성을 기록으로 남기기」를 누르면 다음 편성에서 같은 짝을 피해요."}
function sync(){$("names").value=S.text;$("mode").value=S.mode;$("num").value=S.num;$("avoid").checked=!!S.avoid;$("numLabel").textContent=S.mode==="size"?"모둠당 인원":"모둠 수";$("cnt").textContent=parse().length}
$("names").addEventListener("input",function(){S.text=this.value;$("cnt").textContent=parse().length;save(KEY,S)});
$("mode").addEventListener("change",function(){S.mode=this.value;S.num=S.mode==="size"?4:3;sync();save(KEY,S)});
$("num").addEventListener("input",function(){S.num=Math.max(1,Math.floor(+this.value)||1);save(KEY,S)});
$("avoid").addEventListener("change",function(){S.avoid=this.checked;save(KEY,S)});
$("run").onclick=run;$("again").onclick=run;
$("sample").onclick=function(){S.text=SAMPLE;sync();run()};
$("keep").onclick=function(){if(!S.last)return;S.hist.push(S.last.gs.map(function(g){return g.map(function(p){return p.n})}));if(S.hist.length>5)S.hist=S.hist.slice(-5);draw()};
$("clearHist").onclick=function(){S.hist=[];draw()};
$("print").onclick=function(){window.print()};
$("copy").onclick=function(){if(!S.last)return;var t=S.last.gs.map(function(g,i){return "모둠 "+(i+1)+": "+g.map(function(p){return p.n+(p.t?"("+p.t+")":"")}).join(", ")}).join("\n"),b=this,done=function(){b.textContent="복사됐어요 ✓";setTimeout(function(){b.textContent="결과 복사"},1400)};
 var fb=function(){var ta=document.createElement("textarea");ta.value=t;ta.style.cssText="position:fixed;opacity:0";document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand("copy")}catch(e){}ta.remove();if(ok)done();else window.prompt("복사가 막혀 있어요. 아래 글을 직접 복사해 주세요.",t)};
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,fb)}else fb()};
sync();if(S.last&&S.last.gs)draw();else run();
})();
</script>
</body>
</html>
