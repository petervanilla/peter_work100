<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>점심 메뉴 뽑기</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}:root{--bg:#f6f7fb;--card:#fff;--line:#e5e9f2;--ink:#111827;--sub:#6b7280;--brand:#4f46e5;--brand2:#7c3aed;--ok:#059669;--warn:#d97706;--bad:#e11d48;--r:14px}body{font-family:'Pretendard',ui-sans-serif,system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);padding:14px;min-height:100vh;font-size:14px;line-height:1.5}.wrap{max-width:760px;margin:0 auto}h1{font-size:18px;font-weight:800;letter-spacing:-.02em}.sub{color:var(--sub);font-size:12px;margin-top:2px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:12px;box-shadow:0 1px 2px rgba(17,24,39,.04)}button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:8px 12px;font-weight:700;font-size:12px;transition:.12s}button:hover{border-color:#c7cddb;background:#fafafa}button.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-color:transparent}button.primary:hover{filter:brightness(1.06)}input,select{font:inherit;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-size:13px}input:focus,select:focus{outline:2px solid #c7d2fe;border-color:var(--brand)}label{font-size:10px;font-weight:800;color:var(--sub);display:block;margin-bottom:4px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.muted{font-size:11px;color:var(--sub)}.field{flex:1;min-width:140px}.hero{text-align:center;padding:20px;border-radius:14px;background:linear-gradient(140deg,#eef2ff,#f5f3ff);border:1px solid #c7d2fe}.dish{font-size:30px;font-weight:950;letter-spacing:-.04em;min-height:45px;color:#312e81}.tag{font-size:11px;color:#6366f1;font-weight:800}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.chip{display:inline-flex;gap:5px;align-items:center;padding:6px 9px;border-radius:999px;background:#eef2ff;color:#4338ca;font-size:11px;font-weight:800}.chip button{border:0;background:transparent;color:#818cf8;padding:0;font-size:14px}.menu-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 1px;border-bottom:1px solid #f1f3f7;font-size:12px}.menu-row:last-child{border:0}.history{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.history span{padding:5px 9px;border-radius:8px;background:#f8fafc;border:1px solid var(--line);font-size:11px;color:#475569}.usecases{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}.usecases h2{font-size:12px;font-weight:900;color:var(--sub);margin-bottom:5px}.usecases li{font-size:11px;color:var(--sub);margin-left:15px;margin-bottom:3px}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><div class="wrap">
<header><h1>🍜 점심 메뉴 뽑기</h1><p class="sub">팀의 취향과 오늘 먹은 메뉴를 반영해 점심 후보를 랜덤으로 골라요.</p></header>
<section class="card"><div class="row"><div class="field"><label for="menuName">메뉴 이름</label><input id="menuName" placeholder="예: 칼국수"></div><div class="field" style="max-width:150px"><label for="category">종류</label><select id="category"><option>한식</option><option>일식</option><option>중식</option><option>양식</option><option>분식</option><option>기타</option></select></div><button class="primary" id="add">+ 메뉴 추가</button></div><div id="chips" class="chips"></div></section>
<section class="card"><div class="row" style="justify-content:space-between"><b style="font-size:13px">오늘의 메뉴 후보</b><label style="display:flex;align-items:center;gap:6px;margin:0;font-size:11px"><input id="avoidRepeat" type="checkbox" checked style="width:15px;height:15px;accent-color:var(--brand)"> 오늘 뽑은 메뉴는 잠시 제외</label></div><div class="hero" style="margin-top:10px"><div id="dish" class="dish">오늘 뭐 먹지?</div><div id="dishCategory" class="tag">메뉴를 추가하거나 예시를 불러오세요</div><div class="row" style="justify-content:center;margin-top:12px"><button class="primary" id="draw" style="padding:10px 18px;font-size:13px">🎲 메뉴 뽑기</button><button id="again">다시 뽑기</button></div></div><p class="muted" id="hint" style="margin-top:8px">메뉴 추가·삭제와 오늘 뽑은 기록은 브라우저에 저장돼요.</p></section>
<section class="card"><div class="row" style="justify-content:space-between"><b style="font-size:13px">메뉴 목록</b><span class="muted" id="menuCount"></span></div><div id="list" style="margin-top:5px"></div><div class="row" style="margin-top:10px"><button id="sample">기본 메뉴 채우기</button><button id="reset">오늘 뽑기 기록 초기화</button></div></section>
<section class="card"><b style="font-size:12px">오늘 뽑은 메뉴</b><div id="history" class="history"></div></section>
<div class="usecases"><h2>이럴 때 좋아요</h2><ul><li><b>모든 직장인</b> · 점심 메뉴를 정하느라 매일 단체방에서 같은 고민을 반복할 때</li><li><b>팀장</b> · 팀원 누구나 납득할 공평한 메뉴 후보를 바로 뽑고 싶을 때</li><li><b>사장님(가게)</b> · 오늘의 직원 식사나 손님용 추천 메뉴를 빠르게 고를 때</li></ul></div>
</div><script>
(function(){"use strict";var KEY="lunch-picker-v1";var seed=[{name:"김치찌개",category:"한식"},{name:"제육볶음",category:"한식"},{name:"돈까스",category:"일식"},{name:"쌀국수",category:"기타"},{name:"비빔밥",category:"한식"},{name:"초밥",category:"일식"},{name:"마라탕",category:"중식"},{name:"샐러드",category:"양식"},{name:"칼국수",category:"한식"},{name:"떡볶이",category:"분식"}];var state={menus:[],history:[],today:""};var $=id=>document.getElementById(id);function day(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}function save(){try{state.today=day();localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}function load(){try{var s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&Array.isArray(s.menus))state=s}catch(e){}}function escapeHtml(s){return String(s).replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;"}[c]))}
function render(){if(state.today!==day()){state.today=day();state.history=[]}$("menuCount").textContent=state.menus.length+"개";$("chips").innerHTML=state.menus.map((m,i)=>'<span class="chip">'+escapeHtml(m.name)+' <small style="opacity:.65">'+escapeHtml(m.category)+'</small><button data-i="'+i+'" aria-label="삭제">×</button></span>').join("")||'<span class="muted">메뉴가 없어요.</span>';$("chips").querySelectorAll("button").forEach(b=>b.onclick=()=>{state.menus.splice(Number(b.dataset.i),1);render()});$("list").innerHTML=state.menus.map((m,i)=>'<div class="menu-row"><span>'+escapeHtml(m.name)+' <span class="muted">· '+escapeHtml(m.category)+'</span></span><button data-i="'+i+'" style="border:0;background:transparent;color:#cbd5e1;padding:2px 5px">삭제</button></div>').join("");$("list").querySelectorAll("button").forEach(b=>b.onclick=()=>{state.menus.splice(Number(b.dataset.i),1);render()});$("history").innerHTML=state.history.length?state.history.slice().reverse().map(n=>'<span>'+escapeHtml(n)+'</span>').join(""):'<span class="muted">아직 뽑지 않았어요.</span>';save()}
function draw(){var exclude=$("avoidRepeat").checked?state.history:[];var pool=state.menus.filter(m=>!exclude.includes(m.name));if(!pool.length&&state.menus.length)pool=state.menus;if(!pool.length){$("dish").textContent="메뉴가 없어요";$("dishCategory").textContent="먼저 메뉴를 추가해 주세요";return}var chosen=pool[Math.floor(Math.random()*pool.length)];var btn=$("draw");btn.disabled=true;var reduced=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;var ticks=reduced?1:12;var i=0;var timer=setInterval(function(){var peek=pool[Math.floor(Math.random()*pool.length)];$("dish").textContent=peek.name;$("dishCategory").textContent=peek.category+" · 후보 "+pool.length+"개";i++;if(i>=ticks){clearInterval(timer);$("dish").textContent=chosen.name;$("dishCategory").textContent=chosen.category+" · 오늘의 추천 메뉴";state.history.push(chosen.name);if(state.history.length>8)state.history=state.history.slice(-8);btn.disabled=false;render()}},reduced?1:70)}
$("add").onclick=function(){var n=$("menuName").value.trim();if(!n)return;if(state.menus.some(m=>m.name===n)){alert("이미 있는 메뉴예요.");return}state.menus.push({name:n,category:$("category").value});$("menuName").value="";render()};$("menuName").onkeydown=e=>{if(e.key==="Enter")$("add").click()};$("draw").onclick=draw;$("again").onclick=draw;$("sample").onclick=function(){state.menus=JSON.parse(JSON.stringify(seed));render()};$("reset").onclick=function(){state.history=[];render()};load();if(!state.menus.length)state.menus=JSON.parse(JSON.stringify(seed));render()})();
</script></body></html>
